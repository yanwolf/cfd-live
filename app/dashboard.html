<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CFD 自動下單</title>
<style>
  :root{--bg:#12161c;--panel:#1a2029;--panel2:#212834;--line:#2c3543;--ink:#e6e9ee;--dim:#8b95a5;
    --up:#e5484d;--down:#2fb36b;--warn:#e0a83a;--gold:#d4a73a;--blue:#7fb3ff;color-scheme:dark}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
  body{padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
  header{display:flex;align-items:center;gap:10px;padding:14px 14px 8px;flex-wrap:wrap}
  header h1{font-size:19px;margin:0;font-weight:650}
  main{padding:4px 12px 40px;max-width:1100px;margin:0 auto}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
  .panel h2{font-size:15px;margin:0 0 10px;font-weight:600}
  .badge{display:inline-block;padding:2px 10px;border-radius:12px;font-size:12.5px;border:1px solid var(--gold);color:var(--gold)}
  .badge.solid{background:var(--gold);color:#1a1405}
  .badge.ok{border-color:var(--down);color:var(--down)}
  .badge.bad{border-color:var(--up);color:var(--up)}
  .badge.dim{border-color:var(--line);color:var(--dim)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .k{font-size:12px;color:var(--dim)} .v{font-size:15px;font-variant-numeric:tabular-nums}
  .up{color:var(--up)} .down{color:var(--down)} .dimc{color:var(--dim)} .gold{color:var(--gold)} .warn{color:var(--warn)}
  table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:13px}
  th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
  th{color:var(--dim);font-weight:500} td.l,th.l{text-align:left}
  .scroll{overflow-x:auto}
  button{font:inherit;cursor:pointer;border-radius:7px;padding:7px 13px}
  .sec{background:var(--panel2);color:var(--ink);border:1px solid var(--line)}
  .kill{background:none;color:var(--up);border:1px solid var(--up);font-weight:650}
  .kill.on{background:var(--up);color:#fff}
  .inst{border:1px solid var(--line);border-radius:9px;padding:12px;margin-bottom:10px;background:var(--panel2)}
  .inst .t{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
  .inst .t b{font-size:16px;color:var(--gold)}
  .ps{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer;flex-wrap:wrap}
  .ps:last-child{border-bottom:0}
  .ps .n{color:var(--gold);font-weight:600}
  .ps .d{color:var(--dim);font-size:12.5px;width:100%}
  .ev{font-size:13px;padding:5px 0;border-bottom:1px solid var(--line);white-space:pre-wrap}
  .ev.error{color:var(--up)} .ev.warn{color:var(--warn)} .ev.trade{color:var(--gold)}
</style>
</head>
<body>
<header>
  <h1>CFD 自動下單</h1>
  <span id="mode" class="badge dim">—</span>
  <span id="conn" class="badge dim">EA —</span>
  <span id="tgb" class="badge dim" style="display:none"></span>
  <span style="flex:1"></span>
  <button id="killbtn" class="kill">緊急停止</button>
</header>
<main>
  <div class="panel"><div class="grid" id="acct"></div></div>
  <div class="panel"><h2>目前持倉</h2><div id="possum"></div></div>
  <div class="panel">
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><h2 style="margin:0">績效統計</h2><span style="flex:1"></span>
      <span class="dimc" style="font-size:12.5px">起算</span><input id="pfstart" type="date" style="font:inherit;background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:5px 8px">
      <button class="sec" id="pfbtn">重新整理</button></div>
    <div id="perf" style="margin-top:8px"><div class="dimc">載入中…</div></div>
  </div>
  <div class="panel"><h2>策略</h2><div id="insts"></div></div>
  <div class="panel">
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><h2 style="margin:0">實盤 vs 回測</h2><span style="flex:1"></span>
      <button class="sec" id="reconbtn">計算對帳</button><button class="sec" id="reconcsv" style="display:none">下載 CSV</button></div>
    <p class="dimc" style="font-size:12.5px;margin:6px 0 0">用同一份 1 分 K、同一支策略，從每支策略開始跑的時間起重跑回測，跟券商成交逐筆比。
      滑價已扣掉點差（點差用商品預設值，單筆會有幾點誤差，看平均）；正數 = 比回測差。</p>
    <div id="recon"></div>
  </div>
  <div class="panel" id="extpanel" style="display:none"><h2>外部訊號：模擬 vs MT5</h2>
    <p class="dimc" style="font-size:12.5px;margin:6px 0 0">策略在別的服務跑（例如 gold-scalper），這裡照著在 MT5 下單，量點差、滑價、延遲。
      滑價：成交價比下單當下的報價差多少（正數＝比較差）。報價差：券商中價 − 對方的幣安價。模擬帳戶的成交通常比真實帳戶理想。</p>
    <div id="ext"></div></div>
  <div class="panel"><h2>事件</h2><div id="events"></div></div>
  <div class="panel"><h2>最近成交（券商）</h2><div class="scroll"><table id="deals"></table></div></div>
  <div class="panel"><h2>最近送出的動作</h2><div class="scroll"><table id="acts"></table></div></div>
</main>
<script>
const $ = s => document.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const fmt = (v, d = 2) => (v === null || v === undefined || v === "") ? "–" : Number(v).toLocaleString("zh-TW", {minimumFractionDigits: d, maximumFractionDigits: d});
const sgn = (v, d = 2) => `<span class="${v > 0 ? "up" : v < 0 ? "down" : ""}">${v > 0 ? "+" : ""}${fmt(v, d)}</span>`;
const tstr = s => s ? new Date(s * 1000).toLocaleString("zh-TW", {hour12: false, month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", second: "2-digit"}) : "–";
async function api(p, body) {
  const r = await fetch(p, body ? {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)} : {});
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}
let KILL = false;
$("#killbtn").onclick = async () => {
  if (!KILL) { if (!confirm("緊急停止：平掉所有策略持倉、撤銷所有掛單，並停止下單。確定？")) return; }
  else if (!confirm("解除緊急停止，恢復自動下單？")) return;
  await api("/api/kill", {on: !KILL}); load();
};
async function load() {
  let s;
  try { s = await api("/api/status"); } catch (e) { $("#conn").className = "badge bad"; $("#conn").textContent = "服務連不上"; return; }
  const a = s.account || {};
  KILL = s.kill;
  $("#killbtn").textContent = KILL ? "已緊急停止（按此解除）" : "緊急停止";
  $("#killbtn").classList.toggle("on", KILL);
  const demo = a.trade_mode === 0;
  $("#mode").className = "badge" + (a.trade_mode === undefined ? " dim" : demo ? "" : " solid");
  $("#mode").textContent = a.trade_mode === undefined ? "尚未連線" : demo ? "🟡 模擬帳戶" : "🟡 實盤";
  const age = s.ea_age;
  $("#conn").className = "badge " + (age === null ? "dim" : age < 15 ? "ok" : age < 180 ? "dim" : "bad");
  $("#conn").textContent = age === null ? "EA 尚未連線" : age < 15 ? "EA 連線中" : `EA ${age} 秒未回應`;
  const tg = s.tg || {};
  const tgLate = tg.pending && tg.oldest && (Date.now() / 1000 - tg.oldest > 60);
  $("#tgb").style.display = tg.enabled && (tgLate || tg.gave_up_24h) ? "" : "none";
  $("#tgb").className = "badge " + (tg.gave_up_24h ? "bad" : "dim");
  $("#tgb").title = tg.last_err || "";
  $("#tgb").textContent = tg.gave_up_24h ? `Telegram 有 ${tg.gave_up_24h} 則送不出去` : `Telegram ${tg.pending} 則待重送`;
  $("#acct").innerHTML = [["券商伺服器", esc(a.server || "–")], ["帳號", esc(a.login || "–")], ["餘額", `${fmt(a.balance)} ${esc(a.currency || "")}`],
    ["淨值", fmt(a.equity)], ["可用保證金", fmt(a.margin_free)], ["MT5 連線", a.connected ? "正常" : '<span class="up">中斷</span>'],
    ["允許自動交易", a.trade_allowed ? "是" : '<span class="up">否（MT5 的「演算法交易」按鈕要開）</span>']]
    .map(([k, v]) => `<div><div class="k">${k}</div><div class="v">${v}</div></div>`).join("");
  const held = s.instances.filter(i => i.positions.length), idle = s.instances.filter(i => !i.positions.length && i.enabled);
  const tot = held.reduce((a, i) => a + i.positions.reduce((b, p) => b + (p.profit || 0), 0), 0);
  $("#possum").innerHTML = (held.length ? held.flatMap(i => i.positions.map(p => `<div class="ps" data-go="${esc(i.id)}">
      <span class="n">${esc(i.name)}</span>
      ${p.type === 0 ? '<span class="up">多</span>' : '<span class="down">空</span>'} ${p.volume} 手
      <span style="flex:1"></span>${sgn(p.profit)}
      <div class="d">${esc(i.broker_symbol)} @ ${fmt(p.price)}　停損 ${fmt(p.sl)}　停利 ${p.tp ? fmt(p.tp) : "–"}　${i.orders.length ? `掛單 ${i.orders.length} 張` : ""}</div></div>`)).join("")
      + (held.length > 1 ? `<div class="ps" style="cursor:default"><span class="dimc">合計浮動</span><span style="flex:1"></span>${sgn(tot)}</div>` : "")
    : '<div class="dimc" style="padding:4px 0">目前沒有任何持倉</div>')
    + (idle.length ? `<div class="dimc" style="font-size:12.5px;margin-top:8px">無持倉：${idle.map(i => esc(i.name)).join("、")}</div>` : "");
  document.querySelectorAll("[data-go]").forEach(r => r.onclick = () => document.getElementById("inst-" + r.dataset.go).scrollIntoView({behavior: "smooth", block: "start"}));
  $("#insts").innerHTML = s.instances.map(i => {
    const p = i.positions[0];
    const state = !i.enabled ? '<span class="badge dim">停用</span>' : i.paused_reason ? `<span class="badge bad">暫停：${esc(i.paused_reason)}</span>`
      : i.paused ? '<span class="badge dim">暫停進場</span>' : '<span class="badge ok">運作中</span>';
    const pos = p ? `${p.type === 0 ? '<span class="up">多</span>' : '<span class="down">空</span>'} ${p.volume} 手 @ ${fmt(p.price)}　停損 ${fmt(p.sl)}　停利 ${p.tp ? fmt(p.tp) : "–"}　浮動 ${sgn(p.profit)}`
      : '<span class="dimc">無持倉</span>';
    const ords = i.orders.length ? i.orders.map(o => `${esc(o.type)} ${o.volume} @ ${fmt(o.price)}`).join("　") : '<span class="dimc">無</span>';
    const intent = (i.last_orders || []).map(o => `${esc(o.label)}${o.price ? " " + fmt(o.price) : ""}`).join("、") || '<span class="dimc">無</span>';
    return `<div class="inst" id="inst-${esc(i.id)}" style="scroll-margin-top:10px"><div class="t"><b>${esc(i.name)}</b><span class="dimc">${esc(i.strategy)}／${esc(i.broker_symbol)}／${i.lots} 手／magic ${i.magic}</span>${state}
      <span style="flex:1"></span><button class="sec" data-p="${esc(i.id)}" data-on="${i.paused ? 0 : 1}">${i.paused ? "恢復進場" : "暫停進場"}</button></div>
      <div class="grid">
        <div style="grid-column:1/-1"><div class="k">持倉</div><div class="v">${pos}</div></div>
        <div style="grid-column:1/-1"><div class="k">券商掛單</div><div class="v">${ords}</div></div>
        <div style="grid-column:1/-1"><div class="k">上一根 K 收盤時策略的掛單</div><div class="v">${intent}</div></div>
        <div><div class="k">上一根 K 結束</div><div class="v">${tstr(i.last_bar_end)}</div></div>
        <div><div class="k">收盤價</div><div class="v">${fmt(i.last_close)}</div></div>
        <div><div class="k">最新 1 分 K</div><div class="v">${tstr(i.last_m1)}</div></div>
      </div></div>`;
  }).join("");
  document.querySelectorAll("button[data-p]").forEach(b => b.onclick = async () => { await api("/api/pause", {id: b.dataset.p, on: b.dataset.on === "1"}); load(); });
  $("#events").innerHTML = s.events.map(e => `<div class="ev ${e.level}">${tstr(e.ts)}　${esc(e.msg)}</div>`).join("") || '<div class="dimc">尚無事件</div>';
  $("#deals").innerHTML = `<tr><th class="l">時間</th><th class="l">商品</th><th>方向</th><th>開／平</th><th>手數</th><th>價格</th><th>損益</th><th>利息</th><th>magic</th></tr>` +
    s.deals.map(d => `<tr><td class="l">${tstr(d.time_utc)}</td><td class="l">${esc(d.symbol)}</td><td>${d.type === 0 ? "買" : "賣"}</td><td>${d.entry === 0 ? "開" : "平"}</td>
      <td>${d.volume}</td><td>${fmt(d.price)}</td><td>${d.entry === 0 ? "" : sgn(d.profit)}</td><td>${d.swap ? sgn(d.swap) : ""}</td><td>${d.magic}</td></tr>`).join("");
  $("#acts").innerHTML = `<tr><th>#</th><th class="l">時間</th><th class="l">策略</th><th class="l">動作</th><th class="l">內容</th><th class="l">狀態</th></tr>` +
    s.actions.map(x => { const p = x.payload, r = x.result;
      const desc = [p.side, p.volume ? p.volume + " 手" : "", p.price ? "@" + fmt(p.price) : "", p.sl ? "SL " + fmt(p.sl) : "", p.tp ? "TP " + fmt(p.tp) : "", p.ticket ? "#" + p.ticket : "", p.reason || ""].filter(Boolean).join(" ");
      const st = x.status === "failed" ? `<span class="up">失敗 ${r ? esc(r.retcode + " " + (r.msg || "")) : ""}</span>` : x.status === "done" ? '<span class="down">完成</span>' : esc(x.status);
      return `<tr><td>${x.id}</td><td class="l">${tstr(x.created)}</td><td class="l">${esc(x.inst)}</td><td class="l">${esc(x.op)}</td><td class="l">${esc(desc)}</td><td class="l">${st}</td></tr>`; }).join("");
}
// ---------------------------------------------------------------- 績效統計
const PF_COLORS = ["#d4a73a", "#7fb3ff", "#b48cff", "#4fd1c5", "#f08a5d", "#c7c7c7", "#e07ab8", "#9ad06b"];
function multiSVG(series, h = 220) {
  const all = series.flatMap(s => s.pts); if (!all.length) return '<div class="dimc">尚無已平倉交易</div>';
  const t0 = Math.min(...all.map(p => p.t)), t1 = Math.max(PERF.now, ...all.map(p => p.t)), w = 680;
  const vs = all.map(p => p.eq), mn = Math.min(0, ...vs), mx = Math.max(0, ...vs), rg = (mx - mn) || 1;
  const X = t => t1 === t0 ? w / 2 : (t - t0) / (t1 - t0) * w, Y = v => h - 8 - (v - mn) / rg * (h - 16);
  const paths = series.map(s => { if (!s.pts.length) return "";
    let d = `M0,${Y(0).toFixed(1)}`; s.pts.forEach(p => d += `H${X(p.t).toFixed(1)}V${Y(p.eq).toFixed(1)}`); d += `H${w}`;
    return `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.w || 1.6}"/>`; }).join("");
  const day = t => new Date(t * 1000).toLocaleDateString("zh-TW");
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="width:100%;height:${h}px;display:block">
    <line x1="0" y1="${Y(0).toFixed(1)}" x2="${w}" y2="${Y(0).toFixed(1)}" stroke="#2c3543"/>${paths}</svg>
    <div style="display:flex;justify-content:space-between;color:var(--dim);font-size:11px"><span>${day(t0)}</span><span>${day(t1)}</span></div>
    <div style="display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;margin-top:6px">${series.map(s => `<span><span style="display:inline-block;width:14px;height:3px;background:${s.color};vertical-align:middle;margin-right:5px"></span>${esc(s.name)}</span>`).join("")}</div>`;
}
let PERF = null;
async function loadPerf() {
  const st = $("#pfstart").value;
  const q = st ? "?start=" + Math.floor(new Date(st + "T00:00:00").getTime() / 1000) : "";
  try { PERF = await api("/api/perf" + q); } catch (e) { $("#perf").innerHTML = `<div class="up">${esc(e.message)}</div>`; return; }
  if (!st && PERF.start) $("#pfstart").value = new Date(PERF.start * 1000).toLocaleDateString("sv-SE");
  const a = PERF.account, cur = PERF.currency, S = PERF.strategies;
  const tile = (k, v) => `<div><div class="k">${k}</div><div class="v" style="font-size:18px">${v}</div></div>`;
  const money = v => v === null || v === undefined ? "–" : sgn(v);
  const series = S.filter(x => x.curve.length).map((x, i) => ({name: x.name, color: PF_COLORS[i % PF_COLORS.length], pts: x.curve}));
  const d = t => t ? new Date(t * 1000).toLocaleString("zh-TW", {hour12: false, month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit"}) : "–";
  $("#perf").innerHTML = `
    <div class="inst"><div class="t"><b>帳戶合計（已實現，${esc(cur)}）</b><span class="dimc">自 ${PERF.start ? new Date(PERF.start * 1000).toLocaleDateString("zh-TW") : "–"}</span></div>
      <div class="grid">${tile("已實現損益", money(a.net_money))}${tile("平倉筆數", a.closes)}${tile("勝率", a.win_rate === null ? "–" : a.win_rate + "%")}
        ${tile("最大回撤", a.max_dd ? `<span class="down">${fmt(a.max_dd)}</span>` : "0")}${tile("持倉中", a.open_n ? `${a.open_n} 筆　浮動 ${money(a.floating)}` : "空手")}
        ${tile("帳戶淨值", fmt(a.equity))}</div>
      <div style="margin-top:10px">${multiSVG([{name: "帳戶合計", color: a.net_money >= 0 ? "#e5484d" : "#2fb36b", pts: a.curve, w: 2.4}])}</div>
      <div class="dimc" style="font-size:12.5px;margin-top:6px">金額 = 券商損益 + 隔夜利息 + 手續費，已含點差與滑價。各策略持倉獨立（Hedge），帳戶合計就是各策略相加。</div></div>
    <div class="inst"><div class="t"><b>各策略</b></div>
      ${multiSVG(series, 200)}
      <div class="scroll" style="margin-top:10px"><table><tr><th class="l">策略</th><th class="l">商品</th><th>起</th><th>交易</th><th>淨損益</th><th>點數</th><th>勝率</th><th>PF</th><th>平均</th><th>最大回撤</th><th class="l">目前</th></tr>
      ${S.map(x => `<tr><td class="l">${esc(x.name)}${x.enabled ? "" : ' <span class="dimc">（停用）</span>'}</td><td class="l">${esc(x.symbol)}</td>
        <td>${x.first ? new Date(x.first * 1000).toLocaleDateString("zh-TW", {month: "2-digit", day: "2-digit"}) : "–"}</td><td>${x.trades}</td>
        <td>${money(x.net_money)}</td><td>${x.trades ? sgn(x.net_pts, 1) : "–"}</td><td>${x.win_rate === null ? "–" : x.win_rate + "%"}</td>
        <td>${x.pf === null ? "–" : fmt(x.pf)}</td><td>${money(x.avg_money)}</td><td>${x.max_dd ? fmt(x.max_dd) : "–"}</td>
        <td class="l">${x.open.length ? x.open.map(o => `${o.side === "多" ? '<span class="up">多</span>' : '<span class="down">空</span>'} @ ${fmt(o.price)} ${money(o.profit)}`).join("、") : '<span class="dimc">空手</span>'}</td></tr>`).join("")}
      </table></div>
      <div class="dimc" style="font-size:12.5px;margin-top:6px">點數 = 出場價 − 進場價（依方向），不同商品的點數不能直接相加，比較請看金額。交易筆數少的時候勝率、PF 參考價值有限。</div></div>
    ${S.filter(x => x.last.length).map(x => `<details class="inst"><summary style="cursor:pointer"><b class="gold">${esc(x.name)}</b> <span class="dimc">最近 ${x.last.length} 筆</span></summary>
      <div class="scroll" style="margin-top:8px"><table><tr><th class="l">進場</th><th class="l">出場</th><th>方向</th><th>手數</th><th>進</th><th>出</th><th>點數</th><th>利息</th><th>損益</th></tr>
      ${x.last.map(t => `<tr><td class="l">${d(t.entry_ts)}</td><td class="l">${d(t.exit_ts)}</td><td>${t.dir > 0 ? '<span class="up">多</span>' : '<span class="down">空</span>'}</td>
        <td>${t.vol}</td><td>${fmt(t.entry)}</td><td>${fmt(t.exit)}</td><td>${sgn(t.pts)}</td><td>${t.swap ? sgn(t.swap) : ""}</td><td>${sgn(t.money)}</td></tr>`).join("")}</table></div></details>`).join("")}`;
}
$("#pfbtn").onclick = loadPerf;
$("#pfstart").onchange = loadPerf;
loadPerf(); setInterval(loadPerf, 60000);

let RECON = null;
const ago = s => s === null || s === undefined ? "–" : (Math.abs(s) < 120 ? `${s > 0 ? "+" : ""}${s} 秒` : `${s > 0 ? "+" : ""}${Math.round(s / 60)} 分`);
const slip = v => v === null || v === undefined ? "–" : `<span class="${v > 0 ? "warn" : ""}">${v > 0 ? "+" : ""}${fmt(v, 2)}</span>`;
$("#reconbtn").onclick = async () => {
  $("#reconbtn").disabled = true; $("#recon").innerHTML = '<div class="dimc" style="padding:8px 0">計算中…（每支策略重跑一次回測，約幾秒到幾十秒）</div>';
  try { RECON = await api("/api/recon"); renderRecon(); $("#reconcsv").style.display = ""; }
  catch (e) { $("#recon").innerHTML = `<div class="up">${esc(e.message)}</div>`; }
  $("#reconbtn").disabled = false;
};
function renderRecon() {
  $("#recon").innerHTML = RECON.map(x => {
    if (x.error) return `<div class="inst"><b class="gold">${esc(x.name)}</b>　<span class="up">${esc(x.error)}</span></div>`;
    const s = x.summary;
    const head = `<div class="grid" style="margin-top:6px">
      <div><div class="k">實盤／回測筆數</div><div class="v">${s.live_n}／${s.bt_n}</div></div>
      <div><div class="k">相符</div><div class="v">${s.matched}</div></div>
      <div><div class="k">回測有、實盤沒有</div><div class="v ${s.missed ? "warn" : ""}">${s.missed}</div></div>
      <div><div class="k">實盤有、回測沒有</div><div class="v ${s.extra ? "warn" : ""}">${s.extra}</div></div>
      <div><div class="k">平均進場滑價（點）</div><div class="v">${slip(s.entry_slip_avg)}</div></div>
      <div><div class="k">平均出場滑價（點）</div><div class="v">${slip(s.exit_slip_avg)}</div></div>
      <div><div class="k">每邊滑價（實測／回測設定）</div><div class="v">${slip(s.slip_per_side)}／${fmt(s.slip_assumed, 1)}</div></div>
      <div><div class="k">已平倉相符筆：實盤點數／回測點數</div><div class="v">${sgn(s.live_pts)}／${sgn(s.bt_pts)}</div></div>
      <div><div class="k">實盤已實現損益</div><div class="v">${sgn(s.live_money)}</div></div>
      <div><div class="k">起算</div><div class="v">${tstr(s.since)}</div></div></div>`;
    const rows = x.rows.slice().reverse().map(r => `<tr>
      <td class="l ${r.status === "相符" ? "" : "warn"}">${r.status}</td><td>${r.dir > 0 ? '<span class="up">多</span>' : '<span class="down">空</span>'}</td>
      <td class="l">${tstr(r.live_entry_ts || r.bt_entry_ts)}</td><td>${ago(r.entry_dt)}</td>
      <td>${fmt(r.live_entry)}</td><td>${fmt(r.bt_entry)}</td><td>${slip(r.entry_slip)}</td>
      <td class="l">${r.live_exit_ts ? tstr(r.live_exit_ts) : (r.live_entry_ts ? "持倉中" : "")}</td><td>${ago(r.exit_dt)}</td>
      <td>${fmt(r.live_exit)}</td><td>${fmt(r.bt_exit)}</td><td>${slip(r.exit_slip)}</td>
      <td class="l">${esc(r.bt_out || "")}</td><td>${r.live_pts === null ? "–" : sgn(r.live_pts)}</td><td>${r.bt_pts_after_spread === null ? "–" : sgn(r.bt_pts_after_spread)}</td></tr>`).join("");
    return `<div class="inst"><div class="t"><b>${esc(x.name)}</b><span class="dimc">${esc(x.strategy)}／${esc(x.symbol)}／magic ${x.magic}${x.enabled ? "" : "／已停用"}</span></div>${head}
      <details style="margin-top:8px"><summary class="dimc" style="cursor:pointer">逐筆明細（${x.rows.length} 筆）</summary>
      <div class="scroll"><table><tr><th class="l">狀態</th><th>方向</th><th class="l">進場時間</th><th>時間差</th><th>實盤進場</th><th>回測進場</th><th>進場滑價</th>
      <th class="l">出場時間</th><th>時間差</th><th>實盤出場</th><th>回測出場</th><th>出場滑價</th><th class="l">回測出場原因</th><th>實盤點數</th><th>回測點數</th></tr>${rows}</table></div></details></div>`;
  }).join("") || '<div class="dimc">沒有策略</div>';
}
$("#reconcsv").onclick = () => {
  const cols = ["status", "dir", "live_entry_ts", "bt_entry_ts", "entry_dt", "live_entry", "bt_entry", "entry_slip", "live_exit_ts", "bt_exit_ts", "exit_dt",
                "live_exit", "bt_exit", "exit_slip", "bt_in", "bt_out", "live_pts", "bt_pts_after_spread", "live_money"];
  const iso = v => v ? new Date(v * 1000).toISOString().replace("T", " ").slice(0, 19) : "";
  let out = "\ufeff## 摘要\nid,name,strategy,symbol,magic," + Object.keys((RECON.find(x => x.summary) || {summary: {}}).summary).join(",") + "\n";
  RECON.filter(x => x.summary).forEach(x => out += [x.id, x.name, x.strategy, x.symbol, x.magic, ...Object.values(x.summary)].join(",") + "\n");
  out += "\n## 逐筆\nid," + cols.join(",") + "\n";
  RECON.filter(x => x.rows).forEach(x => x.rows.forEach(r => out += [x.id, ...cols.map(c => c.endsWith("_ts") ? iso(r[c]) : (r[c] ?? ""))].join(",") + "\n"));
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([out], {type: "text/csv;charset=utf-8"}));
  a.download = `recon_${new Date().toISOString().slice(0, 10)}.csv`; document.body.append(a); a.click(); a.remove();
};
async function loadExt() {
  let xs;
  try { xs = await api("/api/ext"); } catch (e) { return; }
  $("#extpanel").style.display = xs.length ? "" : "none";
  const n2 = v => v === null || v === undefined ? "–" : (v > 0 ? "+" : "") + Number(v).toFixed(2);
  $("#ext").innerHTML = xs.map(x => {
    const m = x.summary, d = x.desired || {}, p = d.position;
    const age = x.desired_age;
    const feed = age === null ? '<span class="badge bad">還沒收到回報</span>' : age < 60 ? '<span class="badge ok">回報正常</span>'
      : `<span class="badge ${age < 180 ? "dim" : "bad"}">${age} 秒沒回報</span>`;
    const want = p ? `${p.direction === "bullish" ? '<span class="up">多</span>' : '<span class="down">空</span>'} @ ${fmt(p.entry_price)}（幣安），停損距離 ${fmt(p.sl_points)}` : '<span class="dimc">空手</span>';
    const rows = (x.trades || []).slice(0, 30).map(t => `<tr><td>${new Date((t.signal_ts || 0) * 1000).toLocaleString("zh-TW", {hour12: false, month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit"})}</td>
      <td>${t.dir > 0 ? '<span class="up">多</span>' : t.dir < 0 ? '<span class="down">空</span>' : ""}</td>
      <td>${t.status === "skipped" ? `<span class="dimc">略過：${esc(t.skip || "")}</span>` : esc({sent: "已送出", open: "持倉中", closed: "已平倉"}[t.status] || t.status || "")}</td>
      <td class="mono">${fmt(t.sim_entry_price)}→${t.sim_exit_price ? fmt(t.sim_exit_price) : "–"}</td>
      <td class="mono">${t.fill_price ? fmt(t.fill_price) : "–"}→${t.exit_price ? fmt(t.exit_price) : "–"}</td>
      <td class="mono">${n2(t.sim_pnl_points)}</td><td class="mono">${n2(t.mt5_points)}</td>
      <td class="mono">${n2(t.spread)}</td><td class="mono">${n2(t.entry_slip)}／${n2(t.exit_slip)}</td>
      <td class="mono">${t.fill_ts && t.signal_ts ? (t.fill_ts - t.signal_ts) + "s" : "–"}</td><td class="mono">${n2(t.basis)}</td></tr>`).join("");
    return `<div class="inst"><div class="t"><b>${esc(x.name)}</b><span class="dimc">${esc(x.source || "")}／${esc(x.engine_id)}</span>${feed}</div>
      <div class="dimc" style="font-size:12.5px;margin:4px 0">對方目前：${want}</div>
      <div class="grid">
        <div><div class="k">已平倉（對得上模擬）</div><div class="v">${m.trades}（${m.matched}）</div></div>
        <div><div class="k">模擬 vs MT5（點，對得上的）</div><div class="v">${n2(m.sim_points_matched)} vs ${n2(m.mt5_points_matched)}</div></div>
        <div><div class="k">每筆差（MT5 − 模擬）</div><div class="v">${n2(m.avg_diff_points)}</div></div>
        <div><div class="k">MT5 實際（含庫存費、佣金）</div><div class="v">${n2(m.mt5_usd)} USD（費用 ${n2(m.swap_commission_usd)}）</div></div>
        <div><div class="k">平均點差</div><div class="v">${n2(m.avg_spread)}</div></div>
        <div><div class="k">平均滑價 進／出</div><div class="v">${n2(m.avg_entry_slip)}／${n2(m.avg_exit_slip)}</div></div>
        <div><div class="k">訊號→成交平均</div><div class="v">${m.avg_latency_sec === null ? "–" : m.avg_latency_sec + " 秒"}</div></div>
        <div><div class="k">平均報價差（券商−幣安）</div><div class="v">${n2(m.avg_basis)}</div></div>
        <div><div class="k">略過／進行中</div><div class="v">${m.skipped}／${m.open}</div></div>
      </div>
      <div class="scroll" style="margin-top:8px"><table><tr><th>訊號</th><th></th><th>狀態</th><th>模擬（幣安）</th><th>MT5 成交</th><th>模擬點</th><th>MT5點</th><th>點差</th><th>滑價 進／出</th><th>延遲</th><th>報價差</th></tr>${rows}</table></div></div>`;
  }).join("");
}

load(); loadExt(); setInterval(load, 5000); setInterval(loadExt, 15000);
</script>
</body>
</html>
